name: Widget check

# Installs the app on a simulator and prints what the widget system logs about our extension,
# plus any crash reports. Starts by hand, or from a commit whose message contains "[widgetcheck]".

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  check:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[widgetcheck]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          best = [d for d in devices if "iPhone" in d["name"] and "Pro" in d["name"]] or [d for d in devices if "iPhone" in d["name"]]
          print(best[-1]["udid"])')
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
      - name: Open the widget gallery in the simulator
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          set -o pipefail
          TEST_RUNNER_OUTPUT_DIR="$RUNNER_TEMP/shots" xcodebuild test \
            -project StandByStudio.xcodeproj -scheme StandByStudio \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | grep -vE "^(CompileSwift|SwiftCompile|Ld |CodeSign|ProcessInfoPlistFile|CopySwiftLibs|Touch|RegisterExecutionPolicy|Validate|GenerateAssetSymbols|ProcessProductPackaging|SwiftDriver|ExtractAppIntentsMetadata|WriteAuxiliaryFile|CreateBuildDirectory|MkDir|Copy|builtin)" | tail -n 400 || true
          ls -la "$RUNNER_TEMP/shots"
      - name: Crash reports
        run: |
          ls -la ~/Library/Logs/DiagnosticReports | tail -n 20 || true
          for f in $(ls ~/Library/Logs/DiagnosticReports/*StandByWidgets* 2>/dev/null); do echo "--- $f"; head -n 150 "$f"; done
          echo "===== chronod / extension logs ====="
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "chronod" OR process CONTAINS "StandByWidgets"' \
            | grep -iE "standbystudio|StandByWidgets" | tail -n 200 || true
          echo "===== Fatal errors in the widget extension ====="
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process CONTAINS "StandByWidgets"' | grep -iE "fatal|error:" | tail -n 20 || true
      - name: Save screenshots to the "widget-check" branch
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q
          git checkout -q -b widget-check
          git add .
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Widget check from ${{ github.sha }}" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:widget-check
