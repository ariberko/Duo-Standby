name: Screenshots

# Runs the app on an iPhone and an iPad simulator and saves raw screenshots of the best screens
# to the "screenshots" branch. Starts by hand, or from a commit whose message contains "[screenshots]".

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode/Contents/Developer"
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick simulators
        run: |
          xcrun simctl list devices available -j > devices.json
          pick() {
            python3 - "$1" <<'PY'
          import json, sys
          want = sys.argv[1]
          devices = [d for runtime, ds in json.load(open("devices.json"))["devices"].items() if "iOS" in runtime for d in ds]
          if want == "iphone":
              best = [d for d in devices if "iPhone" in d["name"] and "Pro Max" in d["name"]] or [d for d in devices if "iPhone" in d["name"]]
          else:
              best = [d for d in devices if "iPad Pro" in d["name"] and "13" in d["name"]] or [d for d in devices if "iPad" in d["name"]]
          print(best[-1]["udid"])
          PY
          }
          echo "IPHONE=$(pick iphone)" >> "$GITHUB_ENV"
          echo "IPAD=$(pick ipad)" >> "$GITHUB_ENV"
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project StandByStudio.xcodeproj -scheme StandByStudio \
            -destination "id=$IPHONE" -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 20
      - name: Take screenshots
        run: |
          app=build/Build/Products/Debug-iphonesimulator/StandByStudio.app
          shoot() {
            device=$1; folder=$2
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device"
            xcrun simctl status_bar "$device" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
            xcrun simctl install "$device" "$app"
            mkdir -p "shots/$folder"
            while IFS='|' read -r name wait args; do
              [ -z "$name" ] && continue
              xcrun simctl terminate "$device" com.ariberkowitz.standbystudio 2>/dev/null || true
              eval "xcrun simctl launch \"$device\" com.ariberkowitz.standbystudio $args"
              sleep "$wait"
              xcrun simctl io "$device" screenshot "shots/$folder/$name.png"
            done < .github/screenshot-list.txt
          }
          shoot "$IPHONE" iphone
          shoot "$IPAD" ipad
          ls -R shots
      - name: Save screenshots to the "screenshots" branch
        run: |
          cd shots
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Screenshots from ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:screenshots
